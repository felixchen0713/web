baseURL: "https://xiaoxingchen.me/"
title: "Xiaoxing Chen"
theme: ["hugo-PaperMod"]

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

# 顶部导航（像你截图右侧那个 Pages 列表的效果）
menu:
  main:
    - name: About
      url: /about/
      weight: 10
    - name: CV
      url: /cv/
      weight: 20
    - name: Projects
      url: /projects/
      weight: 30
    - name: Publications
      url: /publications/
      weight: 40
    - name: Research
      url: /research/
      weight: 50
    - name: Teaching
      url: /teaching/
      weight: 60
    - name: Blog
      url: /posts/
      weight: 70

params:
  env: production
  description: "Xiaoxing Chen | CS @ Duke | Security"
  author: "Xiaoxing Chen"

  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true

  # ✅ 关闭 PaperMod 默认首页 ProfileMode（我们用 _index.md 自己写主页）
  profileMode:
    enabled: false

markup:
  goldmark:
    renderer:
      unsafe: true
