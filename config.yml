baseURL: "https://xiaoxingchen.me/"
title: "Xiaoxing Chen"
theme: ["hugo-PaperMod"]

enableRobotsTXT: true

pagination:
  pagerSize: 8

outputs:
  home:
    - HTML
    - RSS
    - JSON

menu:
  main:
    - name: About
      url: /about/
      weight: 10
    - name: CV
      url: /cv/
      weight: 20
    - name: Projects
      url: /projects/
      weight: 30
    - name: Publications
      url: /publications/
      weight: 40
    - name: Research
      url: /research/
      weight: 50
    - name: Teaching
      url: /teaching/
      weight: 60
    - name: Blog
      url: /posts/
      weight: 70

params:
  env: production
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true

  # ✅ 关键：开启个人主页模式
  profileMode:
    enabled: true
    title: "Xiaoxing Chen"
    subtitle: "CS Graduate student focusing on security @ Duke University"
    # ✅ 你已经上传到 static/images/felix.jpg
    imageUrl: "/images/felix.jpg"
    imageTitle: "Xiaoxing Chen"
    imageWidth: 160
    imageHeight: 160

    buttons:
      - name: About Me
        url: "/about/"
      - name: CV
        url: "/cv/"
      - name: Projects
        url: "/projects/"
      - name: Blog
        url: "/posts/"

  socialIcons:
    - name: github
      url: "https://github.com/felixchen0713"
    - name: linkedin
      url: "https://www.linkedin.com/in/xiaoxing-chen-8448b7263/"
    - name: email
      url: "mailto:felixchen713@gmail.com"

markup:
  goldmark:
    renderer:
      unsafe: true
